name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: First release or retry an existing draft
        type: choice
        options:
          - initial
          - retry
        default: initial
        required: true
      tag:
        description: Existing vX.Y.Z draft tag (retry only)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      created: ${{ steps.manual.outputs.created || steps.release.outputs.release_created }}
      tag: ${{ steps.manual.outputs.tag || steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare manual first release or retry
        if: github.event_name == 'workflow_dispatch'
        id: manual
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: node scripts/manual-release.cjs
      - name: Require a published baseline before release PRs
        if: github.event_name == 'push'
        id: baseline
        shell: bash
        run: |-
          releases=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName)
          if [ "$releases" = "[]" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publish the first release using Run workflow with mode=initial."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: googleapis/release-please-action@v4
        if: github.event_name == 'push' && steps.baseline.outputs.ready == 'true'
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  windows:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify version and draft
        shell: pwsh
        run: |-
          node scripts/check-release.cjs
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'Expected an existing draft release.' }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib
      - uses: ./.github/actions/prepare-windows-ui
      - run: cargo build --locked --features desktop --bin wow-addons
      - run: npm run test:ui
      - run: npm run dist -- --target x86_64-pc-windows-msvc
      - run: node scripts/export-windows.cjs x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: wow-addons-windows
          path: dist/*
          if-no-files-found: error
      - name: Attach Windows assets
        shell: pwsh
        run: |-
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-diagnostics
          path: ${{ runner.temp }}/wow-tauri-test-*/ui-startup.json
          if-no-files-found: ignore
  macos:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: node scripts/check-release.cjs
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib
      - run: npm run dist -- --target universal-apple-darwin
      - run: node scripts/export-macos.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: wow-addons-macos
          path: dist/*
          if-no-files-found: error
      - name: Attach macOS assets
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
  publish:
    needs:
      - release
      - windows
      - macos
    if: always() && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish completed release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
