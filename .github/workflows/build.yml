name: CI
'on':
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      mode:
        description: Checks only, first release, or retry a draft
        type: choice
        options:
          - check
          - initial
          - retry
        default: check
        required: true
      tag:
        description: Existing vX.Y.Z draft tag (retry only)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.changes.outputs.check }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: changes
        run: node scripts/changes.cjs
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          cache-on-failure: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update

          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libdbus-1-dev
          patchelf
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo test --locked --lib
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Prepare native Windows UI
        if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-windows-ui
      - name: Native Windows UI
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --features desktop --bin wow-addons
          npm run test:ui
      - name: Upload UI diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-diagnostics
          path: ${{ runner.temp }}/wow-tauri-test-*/ui-startup.json
          if-no-files-found: ignore
    needs: changes
    if: needs.changes.outputs.check == 'true'
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      created: ${{ steps.manual.outputs.created || steps.release.outputs.release_created }}
      tag: ${{ steps.manual.outputs.tag || steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare manual first release or retry
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'check'
        id: manual
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: node scripts/manual-release.cjs
      - name: Require a published baseline before release PRs
        if: github.event_name == 'push'
        id: baseline
        shell: bash
        run: |-
          releases=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName)
          if [ "$releases" = "[]" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publish the first release using Run workflow with mode=initial."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: googleapis/release-please-action@v4
        if: github.event_name == 'push' && steps.baseline.outputs.ready == 'true'
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    needs:
      - changes
      - check
    if: >-
      github.event_name != 'pull_request' && needs.check.result == 'success' && (github.event_name == 'push'
      && needs.changes.outputs.release == 'true' || github.event_name == 'workflow_dispatch' && inputs.mode !=
      'check')
    concurrency:
      group: release-metadata
      cancel-in-progress: false
  windows:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          cache-on-failure: false
      - name: Verify version and draft
        shell: pwsh
        run: |-
          node scripts/check-release.cjs
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'Expected an existing draft release.' }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib
      - uses: ./.github/actions/prepare-windows-ui
      - run: cargo build --locked --features desktop --bin wow-addons
      - run: npm run test:ui
      - run: npm run dist -- --target x86_64-pc-windows-msvc
      - run: node scripts/export-windows.cjs x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: wow-addons-windows
          path: dist/*
          if-no-files-found: error
      - name: Attach Windows assets
        shell: pwsh
        run: |-
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-diagnostics
          path: ${{ runner.temp }}/wow-tauri-test-*/ui-startup.json
          if-no-files-found: ignore
  macos:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-universal-release
          cache-on-failure: false
      - run: node scripts/check-release.cjs
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib
      - run: npm run dist -- --target universal-apple-darwin
      - run: node scripts/export-macos.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: wow-addons-macos
          path: dist/*
          if-no-files-found: error
      - name: Attach macOS assets
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
  publish:
    needs:
      - release
      - windows
      - macos
    if: always() && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish completed release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
  result:
    name: CI result
    needs:
      - changes
      - check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CHECK_REQUIRED: ${{ needs.changes.outputs.check }}
        run: |-
          test "$CHANGES_RESULT" = success
          if [ "$CHECK_REQUIRED" = true ]; then
            test "$CHECK_RESULT" = success
          else
            test "$CHECK_REQUIRED" = false
            test "$CHECK_RESULT" = skipped
          fi
