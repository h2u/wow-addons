name: CI
'on':
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      mode:
        description: Checks, prepare the pending draft, or retry published release assets
        type: choice
        options:
          - check
          - prepare
          - retry
        default: check
        required: true
      tag:
        description: Published vX.Y.Z tag (retry only)
        type: string
        required: false
  release:
    types:
      - published
permissions:
  contents: read
concurrency:
  group: >-
    ci-${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name ==
    'workflow_dispatch' && inputs.mode == 'retry' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.changes.outputs.check }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: changes
        run: node scripts/changes.cjs
    if: github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'retry')
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          cache-on-failure: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update

          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libdbus-1-dev
          patchelf
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo test --locked --lib
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Prepare native Windows UI
        if: runner.os == 'Windows'
        uses: ./.github/actions/prepare-windows-ui
      - name: Native Windows UI
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --features desktop --bin wow-addons
          npm run test:ui
          node scripts/test-portable-update.cjs
      - name: Upload UI diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-diagnostics
          path: ${{ runner.temp }}/wow-tauri-test-*/ui-startup.json
          if-no-files-found: ignore
    needs: changes
    if: needs.changes.outputs.check == 'true'
  release:
    name: Select published release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' || github.event_name == 'workflow_dispatch' && inputs.mode == 'retry' &&
      github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        id: select
        env:
          EVENT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        with:
          script: |-
            const { selectRelease } = require('./scripts/release-target.cjs');
            const result = await selectRelease({ github, context, tag: process.env.EVENT_TAG });
            core.setOutput('tag', result.tag);
            core.setOutput('sha', result.sha);
  windows:
    needs: release
    if: needs.release.result == 'success'
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          cache-on-failure: false
      - run: npm ci
      - name: Require updater signing key
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.'; exit 1; }
      - run: npm run format:check
      - run: npm run lint
      - name: Set application version from release tag
        run: node scripts/release-version.cjs
      - run: node scripts/check-release.cjs
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib
      - uses: ./.github/actions/prepare-windows-ui
      - run: cargo build --locked --features desktop --bin wow-addons
      - run: npm run test:ui
      - run: node scripts/test-portable-update.cjs
      - run: npm run dist -- --target x86_64-pc-windows-msvc
      - run: node scripts/export-windows.cjs x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: wow-addons-windows
          path: dist/*
          if-no-files-found: error
      - name: Attach Windows assets
        shell: pwsh
        run: |-
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-diagnostics
          path: ${{ runner.temp }}/wow-tauri-test-*/ui-startup.json
          if-no-files-found: ignore
    name: Build Windows release
  macos:
    needs: release
    if: needs.release.result == 'success'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      APPLE_SIGNING_IDENTITY: '-'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-universal-release
          cache-on-failure: false
      - run: npm ci
      - name: Require updater signing key
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.'; exit 1; }
      - run: npm run format:check
      - run: npm run lint
      - name: Set application version from release tag
        run: node scripts/release-version.cjs
      - run: node scripts/check-release.cjs
      - run: npm run check
      - run: npm test
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --lib
      - run: npm run dist -- --target universal-apple-darwin
      - run: node scripts/export-macos.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: wow-addons-macos
          path: dist/*
          if-no-files-found: error
      - name: Attach macOS assets
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
    name: Build macOS release
  publish:
    needs:
      - release
      - windows
      - macos
    if: always() && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download platform signatures
        run: gh release download "$RELEASE_TAG" --pattern '*.sig' --dir dist
      - name: Generate update manifest
        run: node scripts/update-manifest.cjs
      - name: Publish complete update manifest
        run: gh release upload "$RELEASE_TAG" dist/latest.json --clobber
    name: Finalize release assets
  result:
    name: CI result
    needs:
      - changes
      - check
    if: >-
      always() && github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.mode
      == 'retry')
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CHECK_REQUIRED: ${{ needs.changes.outputs.check }}
        run: |-
          test "$CHANGES_RESULT" = success
          if [ "$CHECK_REQUIRED" = true ]; then
            test "$CHECK_RESULT" = success
          else
            test "$CHECK_REQUIRED" = false
            test "$CHECK_RESULT" = skipped
          fi
  draft:
    name: Update pending draft
    runs-on: ubuntu-latest
    needs:
      - changes
      - check
    if: >-
      always() && needs.changes.result == 'success' && (needs.check.result == 'success' || needs.check.result
      == 'skipped') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.mode
      == 'prepare' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |-
            const { syncDraft } = require('./scripts/draft-release.cjs');
            const result = await syncDraft({ github, context });
            core.info(JSON.stringify(result));
